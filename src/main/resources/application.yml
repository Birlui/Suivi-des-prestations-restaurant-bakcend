server:
  # Render injecte le port d'écoute via la variable PORT.
  port: ${PORT:8080}

spring:
  application:
    name: restauration-marches

  # ---------------------------------------------------------------
  # Profil par défaut : base H2 en mémoire, pratique pour démarrer
  # immédiatement et tester l'API sans installer de base de données.
  # Pour la production, activer le profil "postgres" (voir plus bas
  # et le README) qui pointe vers une vraie base PostgreSQL.
  # ---------------------------------------------------------------
  datasource:
    url: jdbc:h2:mem:marches_restauration;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

# Origines autorisées (CORS), liste séparée par des virgules.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.marches.restauration: INFO

---
# ------------------------------------------------------------------
# Profil "postgres" : à activer en production avec
#   -Dspring.profiles.active=postgres
# et les variables d'environnement DB_URL (ou DB_HOST / DB_PORT / DB_NAME),
# DB_USER et DB_PASSWORD.
# ------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    # DB_URL prioritaire ; sinon construite depuis DB_HOST / DB_PORT / DB_NAME (fournis par Render).
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:marches_restauration}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    hibernate:
      # "update" crée le schéma au premier démarrage (aucun outil de migration
      # n'est configuré). Passer DDL_AUTO=validate une fois le schéma stable.
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
  h2:
    console:
      enabled: false
