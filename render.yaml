# Blueprint Render : backend Spring Boot (Docker) + base PostgreSQL.
# Déploiement : Render Dashboard > New > Blueprint > sélectionner ce dépôt.
databases:
  - name: marches-restauration-db
    plan: free
    databaseName: marches_restauration
    user: marches

services:
  - type: web
    name: restauration-marches-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DB_HOST
        fromDatabase:
          name: marches-restauration-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: marches-restauration-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: marches-restauration-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: marches-restauration-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: marches-restauration-db
          property: password
      # Pas de données de démonstration en production
      - key: APP_DEMO_DATA
        value: "false"
      # URL du front-end déployé (plusieurs valeurs séparées par des virgules)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
